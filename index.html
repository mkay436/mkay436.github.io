<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111114">
  <title>3hoLLLywood fbk</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #111114;
      color: #f5f2ed;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 0, #a66a2c20 0, transparent 34rem),
        linear-gradient(145deg, #171619, #101013 60%, #191411);
    }

    main {
      width: min(100% - 48px, 1528px);
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin-bottom: 56px;
      color: #d3a84f;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.6;
    }

    .breadcrumbs a {
      color: inherit;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .breadcrumbs a:hover,
    .breadcrumbs a:focus-visible {
      color: #ffe2a0;
    }

    .breadcrumbs .separator {
      color: #8d6a32;
      font-size: 19px;
      font-weight: 400;
    }

    .breadcrumbs [aria-current="page"] {
      color: #f5f2ed;
    }

    .section-card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 4vw, 42px);
      border: 1px solid #f2b84b26;
      border-radius: 8px;
      background: linear-gradient(135deg, #222022f2, #191719f2);
      box-shadow: 0 18px 60px #0005;
    }

    .section-card::after {
      position: absolute;
      top: -150px;
      right: -80px;
      width: 360px;
      aspect-ratio: 1;
      border: 1px solid #f2b84b12;
      border-radius: 50%;
      box-shadow: 0 0 0 35px #f2b84b08, 0 0 0 70px #f2b84b05;
      content: "";
      pointer-events: none;
    }

    .section-label {
      margin: 0 0 10px;
      color: #d3a84f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 6vw, 54px);
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .section-details {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #ffffff12;
      color: #aaa5a0;
      font-size: 14px;
    }

    .section-details strong {
      color: #e6dfd5;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 32px, 1528px);
        padding-top: 20px;
      }

      .breadcrumbs {
        gap: 6px 8px;
        margin-bottom: 36px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav class="breadcrumbs" aria-label="Навигационная цепочка">
      <a href="#">Главная</a>
      <span class="separator" aria-hidden="true">›</span>
      <a href="#">Раздел игровых серверов</a>
      <span class="separator" aria-hidden="true">›</span>
      <a href="#">Terpilnya RP #1 - 185.169.134.84:7777</a>
      <span class="separator" aria-hidden="true">›</span>
      <a href="#">United States of Arcadia</a>
      <span class="separator" aria-hidden="true">›</span>
      <a href="#">Объединения</a>
      <span class="separator" aria-hidden="true">›</span>
      <span aria-current="page">Hollywood Gang</span>
    </nav>

    <section class="section-card" aria-labelledby="section-title">
      <p class="section-label">Объединение · United States of Arcadia</p>
      <h1 id="section-title">Hollywood Gang</h1>
      <div class="section-details">
        <span>Игровой сервер: <strong>Terpilnya RP #1</strong></span>
        <span>Адрес: <strong>185.169.134.84:7777</strong></span>
      </div>
    </section>
  </main>
</body>
</html>
