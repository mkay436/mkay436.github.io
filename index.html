<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111114">
  <title>HOLLYWOOD DAYS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #111114;
      color: #f5f2ed;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 46%, #a66a2c30 0, transparent 34rem),
        linear-gradient(145deg, #171619, #101013 60%, #191411);
    }

    .hollywood-days {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 32px 20px;
      overflow: hidden;
    }

    .hollywood-days::before,
    .hollywood-days::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .hollywood-days::before {
      inset: 18px;
      border: 1px solid #f2b84b26;
    }

    .hollywood-days::after {
      width: min(72vw, 680px);
      aspect-ratio: 1;
      border: 1px solid #f2b84b12;
      border-radius: 50%;
      box-shadow: 0 0 0 55px #f2b84b08, 0 0 0 110px #f2b84b05;
    }

    h1 {
      margin: 0;
      color: #f5f2ed;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 10vw, 112px);
      font-weight: 700;
      letter-spacing: clamp(2px, 1.2vw, 13px);
      line-height: 1;
      text-align: center;
      text-shadow: 0 4px 38px #f2b84b2b;
    }

    h1 span {
      display: block;
      margin-top: 12px;
      color: #f2b84b;
      font-size: .68em;
      letter-spacing: clamp(8px, 2.4vw, 26px);
    }

    @media (max-width: 480px) {
      .hollywood-days::before { inset: 10px; }
      h1 { letter-spacing: 2px; }
      h1 span { letter-spacing: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hollywood-days" aria-label="HOLLYWOOD DAYS">
      <h1>HOLLYWOOD<span>DAYS</span></h1>
    </section>
  </main>
</body>
</html>
